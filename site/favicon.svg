<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fffd2" />
      <stop offset="100%" stop-color="#1dbf91" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- HUD Slate Background -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="url(#hudBg)" stroke="#223344" stroke-width="1.5" />

  <!-- Corner Brackets (HUD style) -->
  <path d="M6 16 L6 6 L16 6" fill="none" stroke="#3ee6b0" stroke-width="2" stroke-linecap="round" />
  <path d="M58 16 L58 6 L48 6" fill="none" stroke="#3ee6b0" stroke-width="2" stroke-linecap="round" />
  <path d="M6 48 L6 58 L16 58" fill="none" stroke="#3ee6b0" stroke-width="2" stroke-linecap="round" />
  <path d="M58 48 L58 58 L48 58" fill="none" stroke="#3ee6b0" stroke-width="2" stroke-linecap="round" />

  <!-- Grid Tech Lines -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#1d2e3f" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="32" y1="10" x2="32" y2="54" stroke="#1d2e3f" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Center HUD Diamond / Scope Core -->
  <polygon points="32,15 47,32 32,49 17,32" fill="#142834" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#glow)" />
  
  <!-- Inner Crosshair & Tech Accents -->
  <circle cx="32" cy="32" r="5" fill="none" stroke="#ffd56b" stroke-width="1.5" />
  <circle cx="32" cy="32" r="2" fill="#ffd56b" />

  <!-- Status indicators / ticks -->
  <circle cx="21" cy="21" r="1.5" fill="#3ee6b0" />
  <circle cx="43" cy="21" r="1.5" fill="#3ee6b0" />
  <line x1="28" y1="53" x2="36" y2="53" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
</svg>