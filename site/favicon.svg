<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a1212" />
      <stop offset="60%" stop-color="#2a0505" />
      <stop offset="100%" stop-color="#0a0505" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6c18" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c0c0c0" />
      <stop offset="100%" stop-color="#4a4a4a" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Emblem -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Outer gothic ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#8a1010" stroke-width="1.5"/>

  <!-- Stylized D2 Cross Swords / Soul Gem Motif -->
  <!-- Soul Gem in Center -->
  <polygon points="32,10 40,24 32,38 24,24" fill="#ff2222" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <polygon points="32,16 37,24 32,34 27,24" fill="#ff6666" opacity="0.8"/>

  <!-- Lower Rune Blade -->
  <polygon points="30,36 34,36 33,52 32,56 31,52" fill="url(#bladeGrad)" stroke="#1a1a1a" stroke-width="0.5"/>
  
  <!-- Cross Guard -->
  <path d="M20,38 Q32,42 44,38 Q32,46 20,38 Z" fill="url(#goldGrad)"/>
  
  <!-- Glowing eye/core dot -->
  <circle cx="32" cy="24" r="2" fill="#fff" filter="drop-shadow(0 0 3px #ff0000)"/>
  <circle cx="32" cy="46" r="1.5" fill="#f5d77f"/>
</svg>
